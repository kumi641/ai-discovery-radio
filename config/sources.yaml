     url: "https://github.com/anthropics/claude-agent-sdk-python/releases.atom", per_source_limit: 2}

  # ---------- C. クリエイティブAI（OSS ツール） ----------
  - {id: rel-comfyui, name: ComfyUI Releases, publisher: ComfyUI, category: creative, trust: primary, type: rss,
     url: "https://github.com/comfyanonymous/ComfyUI/releases.atom", per_source_limit: 1}
  - {id: rel-diffusers, name: Diffusers Releases, publisher: Hugging Face, category: creative, trust: primary, type: rss,
     url: "https://github.com/huggingface/diffusers/releases.atom", per_source_limit: 1}
  - {id: rel-remotion, name: Remotion Releases, publisher: Remotion, category: creative, trust: primary, type: rss,
