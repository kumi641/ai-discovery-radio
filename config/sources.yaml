     url: "https://simonwillison.net/atom/everything/", per_source_limit: 6}
  - {id: latent-space, name: Latent Space, publisher: Latent Space, category: practice, trust: secondary, type: rss,
     url: "https://www.latent.space/feed", per_source_limit: 3}
  - {id: hn-ai, name: Hacker News (AI), publisher: Hacker News, category: practice, trust: community, type: hn_algolia,
     url: "https://hn.algolia.com/api/v1/search_by_date", min_points: 150, per_source_limit: 8,
     keywords: ["ai", "llm", "agent", "claude", "gpt", "gemini", "mcp", "model", "diffusion", "openai", "anthropic", "copilot", "codex"]}
  - {id: zenn-claudecode, name: Zenn (Claude Code), publisher: Zenn, category: practice, trust: community, type: rss,
     url: "https://zenn.dev/topics/claudecode/feed", per_source_limit: 4}
  - {id: zenn-aiagent, name: Zenn (AIエージェント), publisher: Zenn, category: practice, trust: community, type: rss,
     url: "https://zenn.dev/topics/aiagent/feed", per_source_limit: 3}
  - {id: qiita-claudecode, name: Qiita (Claude Code), publisher: Qiita, category: practice, trust: community, type: rss,
