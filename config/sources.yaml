  # ---------- 論文 ----------
  - {id: hf-daily-papers, name: Hugging Face Daily Papers, publisher: Hugging Face Papers, category: research, trust: secondary, type: hf_daily_papers,
     url: "https://huggingface.co/api/daily_papers", min_upvotes: 20, per_source_limit: 6}

  # ---------- D. エンジニア・ユーザーの実践事例 ----------
